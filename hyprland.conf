# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                         HYPRLAND CONFIGURATION                           ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Main configuration file - sources modular configs from ./conf/          ║
# ║  See: https://wiki.hyprland.org/                                         ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# Monitor setup (resolution, position, scale)
source = ~/.config/hypr/conf/monitors.conf

# Environment variables (handled by uwsm - see ~/.config/uwsm/env*)
# source = ~/.config/hypr/conf/env.conf

# Autostart applications
source = ~/.config/hypr/conf/autostart.conf

# Keyboard and mouse settings
source = ~/.config/hypr/conf/input.conf

# Visual appearance (gaps, borders, animations)
source = ~/.config/hypr/conf/appearance.conf

# Keybindings
source = ~/.config/hypr/conf/keybinds.conf

# Window and layer rules
source = ~/.config/hypr/conf/rules.conf

# Plugin configuration
source = ~/.config/hypr/conf/plugins.conf
