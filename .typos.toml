# Typos config: https://github.com/crate-ci/typos
# Ignore files that are nothing but hex-color palettes or vendored content.

[files]
extend-exclude = [
  "mocha.conf",
  "wallpapers/",
  "bak/",
  "LICENSE",
]

[default]
# Ignore 6 or 8 character hex strings so palette/theme files don't trip
# the spell-checker on things like "f38ba8" looking like "ba".
extend-ignore-re = [
  '\b[0-9a-fA-F]{6}\b',
  '\b[0-9a-fA-F]{8}\b',
]
