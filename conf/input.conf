# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                           INPUT CONFIGURATION                            ║
# ╚══════════════════════════════════════════════════════════════════════════╝
# Keyboard, mouse, and touchpad settings.
# See: https://wiki.hyprland.org/Configuring/Variables/#input

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_rules =
    kb_options =

    # Mouse follows focus
    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    # Mouse sensitivity (0 = default, -1.0 to 1.0)
    sensitivity = 0
}
