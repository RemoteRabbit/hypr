# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                              APPEARANCE                                  ║
# ╚══════════════════════════════════════════════════════════════════════════╝
# Visual settings: gaps, borders, decorations, and animations.
# See: https://wiki.hyprland.org/Configuring/Variables/

# ─────────────────────────────────────────────────────────────────────────────
# General Layout
# ─────────────────────────────────────────────────────────────────────────────
general {
    gaps_in = 10
    gaps_out = 30
    border_size = 5

    # Gradient border: cyan to green at 45 degrees
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

# ─────────────────────────────────────────────────────────────────────────────
# Decorations (rounding, blur, shadows)
# ─────────────────────────────────────────────────────────────────────────────
decoration {
    rounding = 10
    inactive_opacity = 1

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Animations
# ─────────────────────────────────────────────────────────────────────────────
animations {
    enabled = yes

    # Custom bezier curve for smooth animations
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, default, loop    # Animated gradient border
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# ─────────────────────────────────────────────────────────────────────────────
# Dwindle Layout
# ─────────────────────────────────────────────────────────────────────────────
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# ─────────────────────────────────────────────────────────────────────────────
# Miscellaneous
# ─────────────────────────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
