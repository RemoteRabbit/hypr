# Hyprland plugin configuration. Managed via hyprpm.
# See: https://wiki.hyprland.org/Plugins/Using-Plugins/
#
# Install plugins:
#   hyprpm add https://github.com/Duckonaut/split-monitor-workspaces
#   hyprpm enable split-monitor-workspaces
#   hyprpm reload
#
# NOTE: Plugins must be rebuilt when Hyprland updates.
#       Run `hyprpm update` after Hyprland upgrades.

# ─────────────────────────────────────────────────────────────────────────────
# Split Monitor Workspaces
# ─────────────────────────────────────────────────────────────────────────────
# Provides per-monitor workspaces like AwesomeWM/dwm.
# Status: BROKEN on Hyprland 0.52.0 (waiting for plugin update)
#
# plugin {
#   split-monitor-workspaces {
#     count = 5                    # Workspaces per monitor
#     enable_notifications = 0     # Disable plugin notifications
#   }
# }

