# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                           MONITOR CONFIGURATION                          ║
# ╚══════════════════════════════════════════════════════════════════════════╝
# Configure your monitors here. Use `hyprctl monitors` to list available monitors.
# Format: monitor = name, resolution, position, scale
# See: https://wiki.hyprland.org/Configuring/Monitors/

# Primary monitor (right)
monitor = DP-2, highres, 0x0, 1

# Secondary monitor (left)
monitor = DP-1, highres, -3840x0, 1

# Fallback for any other monitors
monitor = , preferred, auto, 1
