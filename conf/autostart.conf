# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                          AUTOSTART APPLICATIONS                          ║
# ╚══════════════════════════════════════════════════════════════════════════╝
# Applications and services started once when Hyprland launches.
# See: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Desktop Portal (required for screen sharing, file pickers, etc.)
exec-once = systemctl --user start xdg-desktop-portal-hyprland

# System tray applets
exec-once = uwsm app -- blueman-applet
exec-once = uwsm app -- nm-applet

# SSH agent with key
exec-once = eval "$(ssh-agent -s)" && ssh-add ~/.ssh/proton

# Clipboard manager (stores clipboard history)
exec-once = uwsm app -- wl-paste -p -t text --watch clipman store -P --histpath="~/.local/share/clipman-primary.json"

# Wallpaper (using swaybg - hyprpaper-git is broken)
exec-once = swaybg -i /home/remoterabbit/Pictures/Beer-Bucket-Wallpaper.jpg -m fill

# Hyprland plugin manager
exec-once = hyprpm reload -n

# Idle daemon (screen lock, suspend)
exec-once = systemctl --user start hypridle

# Authentication agent (for sudo prompts in GUI apps)
exec-once = systemctl --user start hyprpolkitagent

# Status bar
exec-once = uwsm app -- waybar

# Pyprland (Python plugin system)
exec-once = uwsm app -- pypr
