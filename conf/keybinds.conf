# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                              KEYBINDINGS                                 ║
# ╚══════════════════════════════════════════════════════════════════════════╝
# All keyboard shortcuts. Uses vim-style HJKL for navigation.
# See: https://wiki.hyprland.org/Configuring/Binds/

$mainMod = SUPER

# ─────────────────────────────────────────────────────────────────────────────
# Session
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod, DELETE, exec, hyprlock           # Lock screen
bind = $mainMod SHIFT, Q, exec, wlogout           # Logout menu
bind = $mainMod, M, exit,                         # Exit Hyprland

# ─────────────────────────────────────────────────────────────────────────────
# Applications
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod, RETURN, exec, wezterm            # Terminal
bind = $mainMod, E, exec, dolphin                 # File manager
bind = $mainMod, R, exec, rofi -show drun         # App launcher
bind = $mainMod, S, exec, rofi -show window       # Window switcher
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy  # Clipboard history
bind = $mainMod, period, exec, rofi -show emoji   # Emoji picker

# ─────────────────────────────────────────────────────────────────────────────
# Screenshots
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)"  # Screenshot region

# ─────────────────────────────────────────────────────────────────────────────
# Window Management
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod, Q, killactive,                   # Close window
bind = $mainMod SHIFT, V, togglefloating,         # Toggle floating
bind = $mainMod, F, fullscreen, 0                 # Fullscreen
bind = $mainMod SHIFT, F, fullscreenstate, 0 2    # Fake fullscreen
bind = $mainMod, C, centerwindow                  # Center floating window
bind = $mainMod, G, togglegroup                   # Toggle window group
bind = $mainMod, Tab, cyclenext                   # Cycle windows
bind = $mainMod, P, pseudo,                       # Pseudo-tile (dwindle)
bind = $mainMod, W, togglesplit,                  # Toggle split (dwindle)
bind = $mainMod, B, exec, killall -SIGUSR1 waybar # Toggle waybar

# ─────────────────────────────────────────────────────────────────────────────
# Pyprland Scratchpads
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod, grave, exec, pypr toggle term            # Terminal scratchpad
bind = $mainMod SHIFT, E, exec, pypr toggle files         # File manager scratchpad
bind = $mainMod SHIFT, A, exec, pypr toggle volume        # Volume control scratchpad

# ─────────────────────────────────────────────────────────────────────────────
# Pyprland Utilities
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod, Z, exec, pypr zoom                       # Toggle magnifier
bind = $mainMod, O, exec, pypr expose                     # Expose all windows

# ─────────────────────────────────────────────────────────────────────────────
# Built-in Scratchpad (fallback)
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratchpad   # Move window to scratchpad

# ─────────────────────────────────────────────────────────────────────────────
# Focus (Vim-style HJKL)
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# ─────────────────────────────────────────────────────────────────────────────
# Move Windows (Vim-style HJKL)
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ─────────────────────────────────────────────────────────────────────────────
# Resize Windows (Vim-style HJKL)
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod CONTROL, H, resizeactive, -10 0
bind = $mainMod CONTROL, L, resizeactive, 10 0
bind = $mainMod CONTROL, K, resizeactive, 0 -10
bind = $mainMod CONTROL, J, resizeactive, 0 10

# ─────────────────────────────────────────────────────────────────────────────
# Move Workspace to Monitor
# ─────────────────────────────────────────────────────────────────────────────
bind = $mainMod ALT, H, movecurrentworkspacetomonitor, l
bind = $mainMod ALT, L, movecurrentworkspacetomonitor, r

# ─────────────────────────────────────────────────────────────────────────────
# Workspaces
# ─────────────────────────────────────────────────────────────────────────────
# Split-monitor-workspaces (uncomment when plugin is fixed for Hyprland 0.52+)
# bind = $mainMod, 1, split-workspace, 1
# bind = $mainMod, 2, split-workspace, 2
# bind = $mainMod, 3, split-workspace, 3
# bind = $mainMod, 4, split-workspace, 4
# bind = $mainMod, 5, split-workspace, 5
# bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
# bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
# bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
# bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
# bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ─────────────────────────────────────────────────────────────────────────────
# Mouse Bindings
# ─────────────────────────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow      # Super + LMB to move
bindm = $mainMod, mouse:273, resizewindow    # Super + RMB to resize

# ─────────────────────────────────────────────────────────────────────────────
# Media Keys
# ─────────────────────────────────────────────────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
