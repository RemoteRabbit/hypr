# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                             WINDOW RULES                                 ║
# ╚══════════════════════════════════════════════════════════════════════════╝
# Per-application window behavior. Use `hyprctl clients` to find window info.
# See: https://wiki.hyprland.org/Configuring/Window-Rules/

# ─────────────────────────────────────────────────────────────────────────────
# Steam
# ─────────────────────────────────────────────────────────────────────────────
# Fix Steam popups and dialogs
windowrule {
    name = steam-popups
    match:class = steam
    match:title = ^$
    stay_focused = on
    min_size = 1 1
}

# ─────────────────────────────────────────────────────────────────────────────
# Gaming
# ─────────────────────────────────────────────────────────────────────────────
# Steam games: fullscreen, disable VSync for lower latency, no blur for performance
windowrule {
    name = steam-games
    match:class = steam_app_.*
    fullscreen = on
    immediate = on
    no_blur = on
}

# ─────────────────────────────────────────────────────────────────────────────
# Picture-in-Picture
# ─────────────────────────────────────────────────────────────────────────────
# Float PiP windows, pin to top, position bottom-right
windowrule {
    name = pip
    match:title = Picture-in-Picture
    float = on
    pin = on
    size = 640 360
    move = 100%-650 100%-370
}

# ─────────────────────────────────────────────────────────────────────────────
# Scratchpad
# ─────────────────────────────────────────────────────────────────────────────
# Windows in scratchpad: float, center, and resize
windowrule {
    name = scratchpad
    match:workspace = special:scratchpad
    float = on
    size = 80% 70%
    center = on
}

# ─────────────────────────────────────────────────────────────────────────────
# File Dialogs & Utilities
# ─────────────────────────────────────────────────────────────────────────────
# Float common utility windows
windowrule {
    name = utilities
    match:class = file-roller|ark|pavucontrol
    float = on
}

windowrule {
    name = file-dialogs
    match:title = Open.*|Save.*|Select.*
    float = on
}

# ─────────────────────────────────────────────────────────────────────────────
# Terminal
# ─────────────────────────────────────────────────────────────────────────────
# Slight transparency for terminal
windowrule {
    name = terminal-opacity
    match:class = org.wezfurlong.wezterm
    opacity = 0.95
}
