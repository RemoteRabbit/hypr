# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                             WINDOW RULES                                 ║
# ╚══════════════════════════════════════════════════════════════════════════╝
# Per-application window behavior. Use `hyprctl clients` to find window info.
# See: https://wiki.hyprland.org/Configuring/Window-Rules/

# ─────────────────────────────────────────────────────────────────────────────
# Steam
# ─────────────────────────────────────────────────────────────────────────────
# Fix Steam popups and dialogs
windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$

# ─────────────────────────────────────────────────────────────────────────────
# Gaming
# ─────────────────────────────────────────────────────────────────────────────
# Steam games: fullscreen, disable VSync for lower latency, no blur for performance
windowrulev2 = fullscreen, class:^(steam_app_.*)$
windowrulev2 = immediate, class:^(steam_app_.*)$
windowrulev2 = noblur, class:^(steam_app_.*)$

# ─────────────────────────────────────────────────────────────────────────────
# Picture-in-Picture
# ─────────────────────────────────────────────────────────────────────────────
# Float PiP windows, pin to top, position bottom-right
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 640 360, title:^(Picture-in-Picture)$
windowrulev2 = move 100%-650 100%-370, title:^(Picture-in-Picture)$

# ─────────────────────────────────────────────────────────────────────────────
# Scratchpad
# ─────────────────────────────────────────────────────────────────────────────
# Windows in scratchpad: float, center, and resize
windowrulev2 = float, onworkspace:special:scratchpad
windowrulev2 = size 80% 70%, onworkspace:special:scratchpad
windowrulev2 = center, onworkspace:special:scratchpad

# ─────────────────────────────────────────────────────────────────────────────
# File Dialogs & Utilities
# ─────────────────────────────────────────────────────────────────────────────
# Float common utility windows
windowrulev2 = float, class:^(file-roller|ark|pavucontrol)$
windowrulev2 = float, title:^(Open|Save|Select)(.*)$

# ─────────────────────────────────────────────────────────────────────────────
# Terminal
# ─────────────────────────────────────────────────────────────────────────────
# Slight transparency for terminal
windowrulev2 = opacity 0.95, class:^(org.wezfurlong.wezterm)$

# ─────────────────────────────────────────────────────────────────────────────
# Layer Rules
# ─────────────────────────────────────────────────────────────────────────────
# Blur behind waybar
layerrule = blur, waybar
